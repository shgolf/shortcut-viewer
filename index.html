<!doctype html>
<html lang="ja">

<title>Shortcut shelf — Windows / 開発ツール ショートカット一覧</title>
<meta name="description" content="Windows 11・VS Code・IntelliJ IDEA・Excel・Outlook・PowerPoint のキーボードショートカットを検索して確認できる一覧表です。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='7' y='11' width='18' height='11' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Crect x='11' y='16.5' width='10' height='2' rx='1' fill='white'/%3E%3C/svg%3E">
<style>
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:#f5f7fb}
    #shortcut-viewer{--bg:#f5f7fb;--surface:#fff;--surface-2:#eef2f8;--ink:#172033;--muted:#6d7890;--line:#dfe5ef;--accent:#4f46e5;--accent-soft:#eef0ff;--shadow:0 18px 50px rgba(24,34,64,.10);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding:28px;box-sizing:border-box}
    #shortcut-viewer *{box-sizing:border-box}#shortcut-viewer button,#shortcut-viewer input{font:inherit}
    .sv-shell{max-width:1180px;margin:auto}.sv-header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:24px}.sv-eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}.sv-title{font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.04em;margin:0}.sv-subtitle{color:var(--muted);margin:10px 0 0;font-size:14px}.sv-key{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:12px;white-space:nowrap}.sv-key kbd{background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 7px;font-size:11px;color:var(--ink)}
    .sv-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.sv-tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;padding:10px 13px;cursor:pointer;display:flex;gap:9px;align-items:center;transition:.18s}.sv-tab:hover{border-color:#b9c2d4;transform:translateY(-1px)}.sv-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 7px 18px rgba(79,70,229,.22)}.sv-tab .sv-count{font-size:11px;opacity:.75}.sv-icon{font-size:17px;line-height:1}
    .sv-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.sv-search{position:relative;flex:1;min-width:240px}.sv-search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px 12px 40px;outline:none;color:var(--ink);box-shadow:0 4px 12px rgba(24,34,64,.03)}.sv-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.sv-search span{position:absolute;left:14px;top:10px;font-size:17px;color:var(--muted)}.sv-filter{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 34px 12px 13px;cursor:pointer}
    .sv-content{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.sv-content-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.sv-app-title{display:flex;align-items:center;gap:10px}.sv-app-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);font-size:17px}.sv-app-title h2{font-size:16px;margin:0}.sv-app-title p{font-size:11px;color:var(--muted);margin:2px 0 0}.sv-result{font-size:11px;color:var(--muted)}.sv-groups{padding:0 18px 16px}.sv-group{margin-top:14px}.sv-group h3{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 5px}.sv-row{display:grid;grid-template-columns:minmax(190px,1.25fr) minmax(210px,1fr) 28px;gap:10px;align-items:center;border-top:1px solid var(--line);padding:7px 0}.sv-row:last-child{border-bottom:1px solid var(--line)}.sv-action{font-size:12px}.sv-note{font-size:10px;color:var(--muted);margin-top:1px}.sv-keys{display:flex;gap:3px;flex-wrap:wrap}.sv-keys kbd{background:var(--surface-2);border:1px solid #d8deea;border-bottom:2px solid #c5ccda;border-radius:4px;padding:3px 6px;color:var(--ink);font-size:10px;font-weight:700}.sv-plus{font-size:9px;color:var(--muted);align-self:center}.sv-copy{border:0;background:transparent;color:#9aa5b8;cursor:pointer;border-radius:6px;padding:5px;font-size:13px}.sv-copy:hover{background:var(--surface-2);color:var(--accent)}.sv-copy.copied{color:#0f9f6e}.sv-empty{padding:40px 22px;text-align:center;color:var(--muted)}.sv-empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}.sv-foot{margin-top:10px;color:var(--muted);font-size:10px;text-align:right}
    @media(min-width:900px){.sv-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;align-items:start}.sv-group{min-width:0}}
    @media(max-width:650px){#shortcut-viewer{padding:18px 12px}.sv-header{display:block}.sv-key{margin-top:16px}.sv-content-head{padding:16px}.sv-groups{padding:2px 16px 20px}.sv-row{grid-template-columns:1fr 35px;gap:9px}.sv-keys{grid-column:1/2;grid-row:2}.sv-note{display:none}.sv-copy{grid-column:2;grid-row:1/3}.sv-result{display:none}}
  
</style>

<body>
<div id="shortcut-viewer">
  <div class="sv-shell">
    <header class="sv-header"><div><p class="sv-eyebrow">Windows productivity</p><h1 class="sv-title">Shortcut shelf</h1><p class="sv-subtitle">使うアプリを選ぶだけ。検索して、すぐ確認できます。</p></div><div class="sv-key"><kbd>Ctrl</kbd><span>+</span><kbd>K</kbd><span>で検索</span></div></header>
    <nav class="sv-tabs" id="sv-tabs" aria-label="アプリ選択"></nav>
    <div class="sv-toolbar"><label class="sv-search"><span>⌕</span><input id="sv-search" type="search" placeholder="操作名やキーで検索…" autocomplete="off"></label><select class="sv-filter" id="sv-filter" aria-label="カテゴリで絞り込み"></select></div>
    <main class="sv-content"><div class="sv-content-head"><div class="sv-app-title"><div class="sv-app-mark" id="sv-mark"></div><div><h2 id="sv-name"></h2><p id="sv-description"></p></div></div><span class="sv-result" id="sv-result"></span></div><div class="sv-groups" id="sv-groups"></div></main>
    <div class="sv-foot">※一部の操作はキーボード設定やアプリのバージョンで異なる場合があります。</div>
  </div>
</div>
<script>

    (()=>{
      const apps={
        win:{name:'Windows 11',icon:'⊞',desc:'ウィンドウ・システム操作',items:[['ウィンドウをスナップ','Win','← / →','ウィンドウを画面左右に配置','ウィンドウ'],['タスクビュー','Win','Tab','仮想デスクトップとウィンドウを表示','ウィンドウ'],['ファイル エクスプローラー','Win','E','エクスプローラーを開く','システム'],['設定','Win','I','Windowsの設定を開く','システム'],['クリップボード履歴','Win','V','コピー履歴を表示','入力'],['スクリーンショット','Win','Shift','S','範囲を選択して切り取り','システム'],['画面をロック','Win','L','PCをロックする','システム'],['アプリ切り替え','Alt','Tab','開いているアプリを切り替える','ウィンドウ'],['名前を変更','F2','','選択したファイル名を変更','ファイル'],['完全削除','Shift','Delete','ごみ箱を経由せず削除','ファイル'],['デスクトップを表示','Win','D','すべてのウィンドウを最小化／復元','ウィンドウ'],['実行ダイアログ','Win','R','コマンドやアプリを起動','システム'],['クイックリンク','Win','X','管理用メニューを開く','システム'],['拡大鏡','Win','+','','画面を拡大','アクセシビリティ'],['通知センター','Win','N','通知とカレンダーを表示','システム'],['ウィンドウを閉じる','Alt','F4','現在のウィンドウを閉じる','ウィンドウ'],['ページを更新','F5','','現在の画面を更新','システム'],['全選択','Ctrl','A','','すべて選択','入力']]},
        vscode:{name:'Visual Studio Code',icon:'⌘',desc:'編集・検索・ターミナル',items:[['コマンドパレット','Ctrl','Shift','P','すべてのコマンドを検索','基本'],['クイックオープン','Ctrl','P','','ファイル名で開く','移動'],['ファイル内検索','Ctrl','F','','現在のファイルを検索','検索'],['プロジェクト全体を検索','Ctrl','Shift','F','ワークスペースを検索','検索'],['行へ移動','Ctrl','G','','行番号を指定','移動'],['定義へ移動','F12','','シンボルの定義へ移動','コード'],['複数カーソル','Alt','クリック','','カーソルを追加','編集'],['行コメント','Ctrl','/','','コメントを切り替え','編集'],['ターミナル表示','Ctrl','`','','統合ターミナルを開く','表示'],['サイドバー表示','Ctrl','B','','サイドバーを切り替え','表示'],['保存','Ctrl','S','','現在のファイルを保存','ファイル'],['すべて保存','Ctrl','K','S','開いているファイルをすべて保存','ファイル'],['元に戻す','Ctrl','Z','','直前の操作を取り消す','編集'],['やり直す','Ctrl','Y','','取り消した操作を戻す','編集'],['行を複製','Shift','Alt','↓','現在行を複製','編集'],['行を移動','Alt','↑ / ↓','', '行を上下に移動','編集'],['フォーマット','Shift','Alt','F','ドキュメントを整形','コード'],['参照を検索','Shift','F12','','シンボルの参照を検索','コード'],['問題パネル','Ctrl','Shift','M','','エラーや警告を表示','表示'],['サイドバーにフォーカス','Ctrl','0','','サイドバーへ移動','移動']]},
        idea:{name:'IntelliJ IDEA',icon:'IJ',desc:'コード移動・リファクタリング',items:[['アクション検索','Ctrl','Shift','A','IDEの操作を検索','基本'],['クラスへ移動','Ctrl','N','','クラス名で検索','移動'],['ファイルへ移動','Ctrl','Shift','N','','ファイル名で検索','移動'],['どこからでも検索','Double','Shift','','ファイル・クラス・操作を横断検索','検索'],['定義へ移動','Ctrl','B','','宣言・定義へ移動','コード'],['使用箇所を検索','Alt','F7','','参照されている場所を検索','コード'],['コード整形','Ctrl','Alt','L','','コードを整形','編集'],['リネーム','Shift','F6','','安全に名前を変更','リファクタリング'],['行コメント','Ctrl','/','','コメントを切り替え','編集'],['ターミナル','Alt','F12','','ターミナルを開く','表示'],['保存','Ctrl','S','','変更を保存','基本'],['元に戻す','Ctrl','Z','','操作を取り消す','編集'],['行複製','Ctrl','D','','現在行を複製','編集'],['行削除','Ctrl','Y','','現在行を削除','編集'],['次のエラーへ','F2','','次のエラーや警告へ移動','コード'],['宣言を表示','Ctrl','Q','','クイックドキュメントを表示','コード'],['パラメータ情報','Ctrl','P','','引数情報を表示','コード'],['コード補完','Ctrl','Space','','候補を表示','コード'],['最近使ったファイル','Ctrl','E','','最近のファイルを表示','移動'],['プロジェクトツール','Alt','1','','プロジェクトウィンドウを表示','表示']]},
        excel:{name:'Microsoft Excel',icon:'▦',desc:'セル編集・計算・表操作',items:[['セルの編集','F2','','アクティブセルを編集','編集'],['合計（オートSUM）','Alt','=','選択範囲を合計','計算'],['セル内改行','Alt','Enter','','セル内で改行','編集'],['形式を選択して貼り付け','Ctrl','Alt','V','貼り付け形式を選択','編集'],['フィルター切り替え','Ctrl','Shift','L','フィルターを設定／解除','データ'],['現在の日付','Ctrl',';','','日付を入力','入力'],['現在の時刻','Ctrl','Shift',';','','入力'],['絶対参照に切り替え','F4','','数式の参照形式を変更','数式'],['列全体を選択','Ctrl','Space','','列を選択','移動'],['行全体を選択','Shift','Space','','行を選択','移動'],['ブックを保存','Ctrl','S','','現在のブックを保存','ファイル'],['新しいブック','Ctrl','N','','新しいブックを作成','ファイル'],['開く','Ctrl','O','','ブックを開く','ファイル'],['検索','Ctrl','F','','データを検索','検索'],['置換','Ctrl','H','','データを置換','検索'],['太字','Ctrl','B','','太字を切り替え','書式'],['斜体','Ctrl','I','','斜体を切り替え','書式'],['下線','Ctrl','U','','下線を切り替え','書式'],['行・列の挿入','Ctrl','+','','行や列を挿入','編集'],['行・列の削除','Ctrl','-','','行や列を削除','編集'],['データ範囲の末尾へ','Ctrl','矢印','','連続データの端へ移動','移動'],['シートの切り替え','Ctrl','PageUp / PageDown','','前後のシートへ移動','移動']]},
        outlook:{name:'Microsoft Outlook',icon:'✉',desc:'メール・予定・ナビゲーション',items:[['新しいメール','Ctrl','Shift','M','新規メールを作成','メール'],['返信','Ctrl','R','','選択したメールに返信','メール'],['全員に返信','Ctrl','Shift','R','','全員に返信','メール'],['転送','Ctrl','F','','メールを転送','メール'],['送信','Ctrl','Enter','','メールを送信','メール'],['予定表へ移動','Ctrl','2','','予定表を表示','移動'],['メールへ移動','Ctrl','1','','メールを表示','移動'],['検索','Ctrl','E','','メールや予定を検索','検索'],['フラグを設定','Insert','','フォローアップ用のフラグを設定','メール'],['既読にする','Ctrl','Q','','選択したメールを既読にする','メール'],['新しい予定','Ctrl','Shift','A','予定を作成','予定表'],['新しい会議','Ctrl','Shift','Q','会議を作成','予定表'],['保存して閉じる','Alt','S','','予定や連絡先を保存して閉じる','基本'],['削除','Delete','','選択した項目を削除','基本'],['次の項目','↓','','次のメールや項目へ移動','移動'],['前の項目','↑','','前のメールや項目へ移動','移動'],['未読にする','Ctrl','U','','選択したメールを未読にする','メール'],['迷惑メールとして報告','Ctrl','Alt','J','迷惑メールへ移動','メール'],['アドレス帳','Ctrl','Shift','B','アドレス帳を開く','メール'],['印刷','Ctrl','P','','選択した項目を印刷','基本']]},
        powerpoint:{name:'Microsoft PowerPoint',icon:'P',desc:'スライド作成・発表・配置',items:[['新しいプレゼンテーション','Ctrl','N','','プレゼンテーションを作成','ファイル'],['新しいスライド','Ctrl','M','','スライドを追加','編集'],['スライドショー開始','F5','','最初から発表を開始','発表'],['現在のスライドから開始','Shift','F5','','現在のスライドから発表','発表'],['スライド複製','Ctrl','D','','選択したスライドやオブジェクトを複製','編集'],['グループ化','Ctrl','G','','オブジェクトをグループ化','配置'],['グループ解除','Ctrl','Shift','G','','グループを解除','配置'],['オブジェクトを前面へ','Ctrl','Shift',']','選択オブジェクトを前面へ','配置'],['オブジェクトを背面へ','Ctrl','Shift','[','選択オブジェクトを背面へ','配置'],['発表者ツール','Alt','F5','','発表者ツールで開始','発表'],['保存','Ctrl','S','','プレゼンテーションを保存','ファイル'],['元に戻す','Ctrl','Z','','操作を取り消す','編集'],['やり直す','Ctrl','Y','','取り消した操作を戻す','編集'],['太字','Ctrl','B','','文字の太字を切り替え','文字'],['斜体','Ctrl','I','','文字の斜体を切り替え','文字'],['下線','Ctrl','U','','文字の下線を切り替え','文字'],['中央揃え','Ctrl','E','','段落を中央揃え','段落'],['左揃え','Ctrl','L','','段落を左揃え','段落'],['右揃え','Ctrl','R','','段落を右揃え','段落'],['オブジェクト挿入','Ctrl','K','','ハイパーリンクを挿入','挿入'],['スライド一覧','Ctrl','Shift','Tab','スライドとアウトラインを切り替え','表示'],['ズーム','Ctrl','マウスホイール','','表示倍率を変更','表示']]}
      };
      const store={get(){try{return localStorage.getItem('sv-app')}catch(e){return null}},set(v){try{localStorage.setItem('sv-app',v)}catch(e){}}};
      const copy=t=>{if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));return}fallbackCopy(t)};
      const fallbackCopy=t=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()};
      const order=['win','vscode','idea','excel','outlook','powerpoint'], root=document.getElementById('shortcut-viewer'), tabs=root.querySelector('#sv-tabs'), search=root.querySelector('#sv-search'), filter=root.querySelector('#sv-filter'); let current=store.get()||'win';
      const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function keys(item){const parts=item.slice(1,-2).filter(Boolean);return parts.map((x,i)=>`<kbd>${esc(x)}</kbd>${i<parts.length-1?'<span class="sv-plus">+</span>':''}`).join('')}
      function renderTabs(){tabs.innerHTML=order.map(id=>`<button class="sv-tab" type="button" data-app="${id}" aria-selected="${id===current}"><span class="sv-icon">${apps[id].icon}</span>${apps[id].name}<span class="sv-count">${apps[id].items.length}</span></button>`).join('')}
      function render(){const app=apps[current], q=search.value.trim().toLowerCase(), cat=filter.value; document.getElementById('sv-mark').textContent=app.icon; document.getElementById('sv-name').textContent=app.name; document.getElementById('sv-description').textContent=app.desc; const filtered=app.items.filter(x=>{const category=x[x.length-1], searchable=x.slice(0,-1).join(' ');return (!cat||category===cat)&&(!q||searchable.toLowerCase().includes(q))}); const groups={}; filtered.forEach(x=>(groups[x[x.length-1]]??=[]).push(x)); document.getElementById('sv-result').textContent=`${filtered.length} / ${app.items.length} 件`; document.getElementById('sv-groups').innerHTML=filtered.length?Object.entries(groups).map(([g,items])=>`<section class="sv-group"><h3>${esc(g)}</h3>${items.map(x=>`<div class="sv-row"><div><div class="sv-action">${esc(x[0])}</div><div class="sv-note">${esc(x[x.length-2])}</div></div><div class="sv-keys">${keys(x)}</div><button class="sv-copy" type="button" title="キーをコピー" data-copy="${esc(x.slice(1,-2).filter(Boolean).join(' + '))}">⧉</button></div>`).join('')}</section>`).join(''):`<div class="sv-empty"><strong>見つかりませんでした</strong>検索語やカテゴリを変えてみてください。</div>`;}
      function updateFilter(){const cats=[...new Set(apps[current].items.map(x=>x[x.length-1]))]; filter.innerHTML='<option value="">すべてのカテゴリ</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');}
      tabs.addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(!b)return;current=b.dataset.app;store.set(current);renderTabs();updateFilter();render();}); search.addEventListener('input',render); filter.addEventListener('change',render); root.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;copy(b.dataset.copy);b.textContent='✓';b.classList.add('copied');setTimeout(()=>{b.textContent='⧉';b.classList.remove('copied')},900)}); document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}}); renderTabs();updateFilter();render();
    })();
  
</script>
