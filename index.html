      const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
      const copy=t=>{if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));return}fallbackCopy(t)};
      const fallbackCopy=t=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()};
      const norm=s=>String(s).toLowerCase().replace(/[\s+\uff0b]/g,'');
      // ⌘ などは検索欄に打ちにくいので、記号をローマ字に置き換えた表記でも引けるようにする
      const sub1={'\u2318':'cmd','\u2325':'opt','\u21e7':'shift','\u2303':'ctrl','\u21ea':'capslock'};
      const sub2={'\u2318':'command','\u2325':'option','\u21e7':'shift','\u2303':'control','\u21ea':'capslock'};
      const swap=(s,m)=>s.replace(/[\u2318\u2325\u21e7\u2303\u21ea]/g,c=>m[c]);
      const variants=s=>[s,swap(s,sub1),swap(s,sub2)];
      const detect=()=>/mac|iphone|ipad|ipod/i.test(navigator.userAgentData?.platform||navigator.platform||navigator.userAgent||'')?'mac':'windows';
      const root=document.getElementById('shortcut-viewer'), switcher=root.querySelector('#sv-platform'), tabs=root.querySelector('#sv-tabs'), search=root.querySelector('#sv-search'), filter=root.querySelector('#sv-filter');
      let platform=store.get('sv-platform'); if(!platforms[platform]) platform=detect();
      let current=appFor(platform);
      function appFor(p){const saved=store.get('sv-app-'+p);return platforms[p].apps[saved]?saved:platforms[p].order[0]}
      const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function keys(item){const parts=item.slice(1,-2).filter(Boolean);return parts.map((x,i)=>`<kbd>${esc(x)}</kbd>${i<parts.length-1?'<span class="sv-plus">+</span>':''}`).join('')}
      function renderPlatform(){switcher.innerHTML=Object.keys(platforms).map(id=>`<button type="button" data-platform="${id}" aria-selected="${id===platform}">${platforms[id].label}</button>`).join(''); document.getElementById('sv-eyebrow').textContent=platforms[platform].eyebrow; document.getElementById('sv-modkey').textContent=platforms[platform].mod;}
      function renderTabs(){const P=platforms[platform];tabs.innerHTML=P.order.map(id=>`<button class="sv-tab" type="button" data-app="${id}" aria-selected="${id===current}"><span class="sv-icon">${esc(P.apps[id].icon)}</span>${esc(P.apps[id].name)}<span class="sv-count">${P.apps[id].items.length}</span></button>`).join('')}
      function updateFilter(){const cats=[...new Set(platforms[platform].apps[current].items.map(x=>x[x.length-1]))]; filter.innerHTML='<option value="">すべてのカテゴリ</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');}
      function render(){const app=platforms[platform].apps[current], q=search.value.trim().toLowerCase(), qn=norm(q), terms=q.split(/[\s+＋]+/).filter(Boolean), cat=filter.value; document.getElementById('sv-mark').textContent=app.icon; document.getElementById('sv-name').textContent=app.name; document.getElementById('sv-description').textContent=app.desc; const raw=x=>x.slice(0,-1).join(' '); let filtered=app.items.filter(x=>!cat||x[x.length-1]===cat); if(q){const tight=qn?filtered.filter(x=>variants(raw(x)).some(v=>norm(v).includes(qn))):[]; filtered=tight.length?tight:filtered.filter(x=>{const h=variants(raw(x)).join(' ').toLowerCase();return terms.length?terms.every(t=>h.includes(t)):h.includes(q)});} const groups={}; filtered.forEach(x=>(groups[x[x.length-1]]??=[]).push(x)); document.getElementById('sv-result').textContent=`${filtered.length} / ${app.items.length} 件`; document.getElementById('sv-groups').innerHTML=filtered.length?Object.entries(groups).map(([g,items])=>`<section class="sv-group"><h3>${esc(g)}</h3>${items.map(x=>`<div class="sv-row"><div><div class="sv-action">${esc(x[0])}</div><div class="sv-note">${esc(x[x.length-2])}</div></div><div class="sv-keys">${keys(x)}</div><button class="sv-copy" type="button" title="キーをコピー" data-copy="${esc(x.slice(1,-2).filter(Boolean).join(' + '))}">⧉</button></div>`).join('')}</section>`).join(''):`<div class="sv-empty"><strong>見つかりませんでした</strong>検索語やカテゴリを変えてみてください。</div>`;}
      function drawAll(){renderPlatform();renderTabs();updateFilter();render();}
      switcher.addEventListener('click',e=>{const b=e.target.closest('[data-platform]');if(!b||b.dataset.platform===platform)return;platform=b.dataset.platform;store.set('sv-platform',platform);current=appFor(platform);drawAll();});
      tabs.addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(!b)return;current=b.dataset.app;store.set('sv-app-'+platform,current);renderTabs();updateFilter();render();});
      search.addEventListener('input',render); filter.addEventListener('change',render);
      root.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;copy(b.dataset.copy);b.textContent='✓';b.classList.add('copied');setTimeout(()=>{b.textContent='⧉';b.classList.remove('copied')},900)});
      document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}});
      drawAll();
    })();
