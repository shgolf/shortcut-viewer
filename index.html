<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Shortcut shelf — Windows / Mac ショートカット一覧</title>
<meta name="description" content="Windows・macOS と VS Code・IntelliJ IDEA・Excel・Outlook・PowerPoint のキーボードショートカットを検索して確認できる一覧表です。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='7' y='11' width='18' height='11' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Crect x='11' y='16.5' width='10' height='2' rx='1' fill='white'/%3E%3C/svg%3E">
<style>
/* ページ全体 ------------------------------------------------------------- */
html {
  -webkit-text-size-adjust: 100%;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: #f5f7fb;
}

/* 配色とタイポグラフィ --------------------------------------------------- */
#shortcut-viewer {
  --bg: #f5f7fb;
  --surface: #fff;
  --surface-2: #eef2f8;
  --ink: #172033;
  --muted: #6d7890;
  --line: #dfe5ef;
  --accent: #4f46e5;
  --accent-soft: #eef0ff;
  --shadow: 0 18px 50px rgba(24, 34, 64, 0.1);

  box-sizing: border-box;
  min-height: 100vh;
  padding: 28px;
  color: var(--ink);
  background: var(--bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

#shortcut-viewer * {
  box-sizing: border-box;
}

#shortcut-viewer button,
#shortcut-viewer input {
  font: inherit;
}

.sv-shell {
  max-width: 1180px;
  margin: auto;
}

/* ヘッダー --------------------------------------------------------------- */
.sv-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  margin-bottom: 24px;
}

.sv-eyebrow {
  margin: 0 0 8px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.sv-title {
  margin: 0;
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1.1;
  letter-spacing: -0.04em;
}

.sv-subtitle {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.sv-header-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}

/* Ctrl + K のヒント */
.sv-key {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.sv-key kbd {
  padding: 3px 7px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
  font-size: 11px;
}

/* Windows / Mac の切り替え ----------------------------------------------- */
.sv-platform {
  display: inline-flex;
  gap: 3px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface-2);
}

.sv-platform button {
  padding: 7px 16px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  transition: 0.18s;
}

.sv-platform button:not([aria-selected="true"]):hover {
  color: var(--ink);
}

.sv-platform button[aria-selected="true"] {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 6px 16px rgba(79, 70, 229, 0.22);
}

/* アプリのタブ ----------------------------------------------------------- */
.sv-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.sv-tab {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: 0.18s;
}

.sv-tab:hover {
  border-color: #b9c2d4;
  transform: translateY(-1px);
}

.sv-tab[aria-selected="true"] {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
  box-shadow: 0 7px 18px rgba(79, 70, 229, 0.22);
}

.sv-tab .sv-count {
  font-size: 11px;
  opacity: 0.75;
}

.sv-icon {
  font-size: 17px;
  line-height: 1;
}

/* 検索とカテゴリ絞り込み ------------------------------------------------- */
.sv-toolbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.sv-search {
  position: relative;
  flex: 1;
  min-width: 240px;
}

.sv-search input {
  width: 100%;
  padding: 12px 14px 12px 40px;
  outline: none;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 4px 12px rgba(24, 34, 64, 0.03);
}

.sv-search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.sv-search span {
  position: absolute;
  top: 10px;
  left: 14px;
  color: var(--muted);
  font-size: 17px;
}

.sv-filter {
  padding: 12px 34px 12px 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}

/* 一覧のカード ----------------------------------------------------------- */
.sv-content {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.sv-content-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}

.sv-app-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sv-app-mark {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: var(--accent-soft);
  font-size: 17px;
}

.sv-app-title h2 {
  margin: 0;
  font-size: 16px;
}

.sv-app-title p {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.sv-result {
  color: var(--muted);
  font-size: 11px;
}

/* カテゴリごとのグループ ------------------------------------------------- */
.sv-groups {
  padding: 0 18px 16px;
}

.sv-group {
  margin-top: 14px;
}

.sv-group h3 {
  margin: 0 0 5px;
  color: var(--accent);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* 1行 = 操作名 + 補足 / キー / コピーボタン */
.sv-row {
  display: grid;
  grid-template-columns: minmax(190px, 1.25fr) minmax(210px, 1fr) 28px;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-top: 1px solid var(--line);
}

.sv-row:last-child {
  border-bottom: 1px solid var(--line);
}

.sv-action {
  font-size: 12px;
}

.sv-note {
  margin-top: 1px;
  color: var(--muted);
  font-size: 10px;
}

.sv-keys {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}

.sv-keys kbd {
  padding: 3px 6px;
  border: 1px solid #d8deea;
  border-bottom: 2px solid #c5ccda;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--ink);
  font-size: 10px;
  font-weight: 700;
}

.sv-plus {
  align-self: center;
  color: var(--muted);
  font-size: 9px;
}

.sv-copy {
  padding: 5px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #9aa5b8;
  cursor: pointer;
  font-size: 13px;
}

.sv-copy:hover {
  background: var(--surface-2);
  color: var(--accent);
}

.sv-copy.copied {
  color: #0f9f6e;
}

/* 0件のとき / 注記 ------------------------------------------------------- */
.sv-empty {
  padding: 40px 22px;
  color: var(--muted);
  text-align: center;
}

.sv-empty strong {
  display: block;
  margin-bottom: 4px;
  color: var(--ink);
  font-size: 14px;
}

.sv-foot {
  margin-top: 10px;
  color: var(--muted);
  font-size: 10px;
  text-align: right;
}

/* 広い画面では2カラム ---------------------------------------------------- */
@media (min-width: 900px) {
  .sv-groups {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
    gap: 0 22px;
  }

  .sv-group {
    min-width: 0;
  }
}

/* 狭い画面ではキーを操作名の下へ折り返す --------------------------------- */
@media (max-width: 650px) {
  #shortcut-viewer {
    padding: 18px 12px;
  }

  .sv-header {
    display: block;
  }

  .sv-header-side {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
  }

  .sv-platform button {
    padding: 7px 13px;
  }

  .sv-content-head {
    padding: 16px;
  }

  .sv-groups {
    padding: 2px 16px 20px;
  }

  .sv-row {
    grid-template-columns: 1fr 35px;
    gap: 9px;
  }

  .sv-keys {
    grid-column: 1 / 2;
    grid-row: 2;
  }

  .sv-note {
    display: none;
  }

  .sv-copy {
    grid-column: 2;
    grid-row: 1 / 3;
  }

  .sv-result {
    display: none;
  }
}
</style>
</head>
<body>
<div id="shortcut-viewer">
  <div class="sv-shell">

    <header class="sv-header">
      <div>
        <p class="sv-eyebrow" id="sv-eyebrow">Windows productivity</p>
        <h1 class="sv-title">Shortcut shelf</h1>
        <p class="sv-subtitle">使うアプリを選ぶだけ。検索して、すぐ確認できます。</p>
      </div>
      <div class="sv-header-side">
        <!-- Windows / Mac の切り替え。中身はスクリプトが描画する -->
        <div class="sv-platform" id="sv-platform" role="group" aria-label="プラットフォームを選択"></div>
        <div class="sv-key">
          <kbd id="sv-modkey">Ctrl</kbd><span>+</span><kbd>K</kbd><span>で検索</span>
        </div>
      </div>
    </header>

    <!-- アプリのタブ -->
    <nav class="sv-tabs" id="sv-tabs" aria-label="アプリ選択"></nav>

    <div class="sv-toolbar">
      <label class="sv-search">
        <span>⌕</span>
        <input id="sv-search" type="search" placeholder="操作名やキーで検索…" autocomplete="off">
      </label>
      <select class="sv-filter" id="sv-filter" aria-label="カテゴリで絞り込み"></select>
    </div>

    <main class="sv-content">
      <div class="sv-content-head">
        <div class="sv-app-title">
          <div class="sv-app-mark" id="sv-mark"></div>
          <div>
            <h2 id="sv-name"></h2>
            <p id="sv-description"></p>
          </div>
        </div>
        <span class="sv-result" id="sv-result"></span>
      </div>
      <!-- ショートカット一覧 -->
      <div class="sv-groups" id="sv-groups"></div>
    </main>

    <div class="sv-foot">※一部の操作はキーボード設定やアプリのバージョンで異なる場合があります。</div>

  </div>
</div>

  // ------------------------------------------------------------------
  // 保存領域
  // localStorage が使えない環境（プライベートモード等）でも落とさない
  // ------------------------------------------------------------------
  const store = {
    get(key) {
      try {
        return localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        // 保存できなくても表示は続ける
      }
    },
  };

  // ------------------------------------------------------------------
  // クリップボード
  // ------------------------------------------------------------------
  const fallbackCopy = (text) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
    } catch (e) {
      // 失敗しても何もしない
    }
    ta.remove();
  };

  const copy = (text) => {
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      return;
    }
    fallbackCopy(text);
  };

  // ------------------------------------------------------------------
  // 検索用の正規化
  // ------------------------------------------------------------------
  // スペースと + （半角・全角）を落として比較する
  const norm = (s) => String(s).toLowerCase().replace(/[\s+＋]/g, '');

  // ⌘ ⌥ ⇧ ⌃ は検索欄に打ちにくいので、ローマ字に置き換えた表記でも引けるようにする
  const SYMBOL_SHORT = { '⌘': 'cmd', '⌥': 'opt', '⇧': 'shift', '⌃': 'ctrl', '⇪': 'capslock' };
  const SYMBOL_LONG = { '⌘': 'command', '⌥': 'option', '⇧': 'shift', '⌃': 'control', '⇪': 'capslock' };

  const swap = (s, map) => s.replace(/[⌘⌥⇧⌃⇪]/g, (c) => map[c]);
  const variants = (s) => [s, swap(s, SYMBOL_SHORT), swap(s, SYMBOL_LONG)];

  // command と cmd のような表記ゆれを一方に寄せる。
  // option+cmd+i のように長い名前と短い名前を混ぜて打っても当たるようにするため
  const canon = (s) => norm(s)
    .replace(/command/g, 'cmd')
    .replace(/option/g, 'opt')
    .replace(/control/g, 'ctrl');

  // ------------------------------------------------------------------
  // 行の読み方: [操作名, ...キー, 補足, カテゴリ]
  // ------------------------------------------------------------------
  const action = (item) => item[0];
  const keysOf = (item) => item.slice(1, -2).filter(Boolean);
  const noteOf = (item) => item[item.length - 2];
  const categoryOf = (item) => item[item.length - 1];
  const searchableOf = (item) => item.slice(0, -1).join(' ');

  // ------------------------------------------------------------------
  // 状態
  // ------------------------------------------------------------------
  // 初回はブラウザが報告する OS から選ぶ
  const detectPlatform = () => {
    const ua = navigator.userAgentData?.platform || navigator.platform || navigator.userAgent || '';
    return /mac|iphone|ipad|ipod/i.test(ua) ? 'mac' : 'windows';
  };

  // 表示中のアプリはプラットフォームごとに別々に覚えている
  const appFor = (platformId) => {
    const saved = store.get('sv-app-' + platformId);
    return platforms[platformId].apps[saved] ? saved : platforms[platformId].order[0];
  };

  let platform = store.get('sv-platform');
  if (!platforms[platform]) platform = detectPlatform();
  let current = appFor(platform);

  // ------------------------------------------------------------------
  // 要素
  // ------------------------------------------------------------------
  const root = document.getElementById('shortcut-viewer');
  const switcher = root.querySelector('#sv-platform');
  const tabs = root.querySelector('#sv-tabs');
  const search = root.querySelector('#sv-search');
  const filter = root.querySelector('#sv-filter');
  const eyebrowEl = document.getElementById('sv-eyebrow');
  const modkeyEl = document.getElementById('sv-modkey');
  const markEl = document.getElementById('sv-mark');
  const nameEl = document.getElementById('sv-name');
  const descEl = document.getElementById('sv-description');
  const resultEl = document.getElementById('sv-result');
  const groupsEl = document.getElementById('sv-groups');

  // ------------------------------------------------------------------
  // 描画
  // ------------------------------------------------------------------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[c]));

  // Ctrl + Shift + P のようなキーのチップ列を組み立てる
  const keyChips = (item) => {
    const parts = keysOf(item);
    return parts
      .map((k, i) => `<kbd>${esc(k)}</kbd>${i < parts.length - 1 ? '<span class="sv-plus">+</span>' : ''}`)
      .join('');
  };

  const renderPlatform = () => {
    switcher.innerHTML = Object.keys(platforms)
      .map((id) => `<button type="button" data-platform="${id}" aria-selected="${id === platform}">`
        + `${platforms[id].label}</button>`)
      .join('');
    eyebrowEl.textContent = platforms[platform].eyebrow;
    modkeyEl.textContent = platforms[platform].mod;
  };

  const renderTabs = () => {
    const p = platforms[platform];
    tabs.innerHTML = p.order
      .map((id) => {
        const app = p.apps[id];
        return `<button class="sv-tab" type="button" data-app="${id}" aria-selected="${id === current}">`
          + `<span class="sv-icon">${esc(app.icon)}</span>${esc(app.name)}`
          + `<span class="sv-count">${app.items.length}</span>`
          + '</button>';
      })
      .join('');
  };

  const updateFilter = () => {
    const cats = [...new Set(platforms[platform].apps[current].items.map((x) => categoryOf(x)))];
    filter.innerHTML = '<option value="">すべてのカテゴリ</option>'
      + cats.map((c) => `<option>${esc(c)}</option>`).join('');
  };

  // 検索は「厳密 → 緩い」の2段構え。
  //   1. スペースと + を落とした文字列で部分一致。記号をローマ字に置き換えた
  //      3通りの表記で試すので ⇧⌘P / shift+cmd+p / Ctrl+Shift+P がどれも当たる
  //   2. 1が0件のときだけ、区切って分けた語がすべて含まれるかで判定する
  const matchItems = (items, query) => {
    const compact = norm(query);
    const terms = query.split(/[\s+＋]+/).filter(Boolean);

    const compactCanon = canon(query);
    const tight = compact
      ? items.filter((x) => variants(searchableOf(x))
        .some((v) => norm(v).includes(compact) || canon(v).includes(compactCanon)))
      : [];
    if (tight.length) return tight;

    return items.filter((x) => {
      const hay = variants(searchableOf(x)).join(' ').toLowerCase();
      return terms.length ? terms.every((t) => hay.includes(t)) : hay.includes(query);
    });
  };

  const rowHtml = (item) => '<div class="sv-row">'
    + `<div><div class="sv-action">${esc(action(item))}</div>`
    + `<div class="sv-note">${esc(noteOf(item))}</div></div>`
    + `<div class="sv-keys">${keyChips(item)}</div>`
    + `<button class="sv-copy" type="button" title="キーをコピー" data-copy="${esc(keysOf(item).join(' + '))}">⧉</button>`
    + '</div>';

  const render = () => {
    const app = platforms[platform].apps[current];
    const query = search.value.trim().toLowerCase();
    const cat = filter.value;

    markEl.textContent = app.icon;
    nameEl.textContent = app.name;
    descEl.textContent = app.desc;

    let items = app.items.filter((x) => !cat || categoryOf(x) === cat);
    if (query) items = matchItems(items, query);

    // カテゴリごとにまとめる（見出しの順は最初に出てきた順）
    const groups = {};
    items.forEach((x) => (groups[categoryOf(x)] ??= []).push(x));

    resultEl.textContent = `${items.length} / ${app.items.length} 件`;
    groupsEl.innerHTML = items.length
      ? Object.entries(groups)
        .map(([name, rows]) => `<section class="sv-group"><h3>${esc(name)}</h3>`
          + rows.map(rowHtml).join('')
          + '</section>')
        .join('')
      : '<div class="sv-empty"><strong>見つかりませんでした</strong>検索語やカテゴリを変えてみてください。</div>';
  };

  const drawAll = () => {
    renderPlatform();
    renderTabs();
    updateFilter();
    render();
  };

  // ------------------------------------------------------------------
  // イベント
  // ------------------------------------------------------------------
  switcher.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-platform]');
    if (!btn || btn.dataset.platform === platform) return;
    platform = btn.dataset.platform;
    store.set('sv-platform', platform);
    current = appFor(platform);
    drawAll();
  });

  tabs.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-app]');
    if (!btn) return;
    current = btn.dataset.app;
    store.set('sv-app-' + platform, current);
    renderTabs();
    updateFilter();
    render();
  });

  search.addEventListener('input', render);
  filter.addEventListener('change', render);

  // コピーボタン（一覧は描き直されるので親側で受ける）
  root.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    copy(btn.dataset.copy);
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '⧉';
      btn.classList.remove('copied');
    }, 900);
  });

  // Ctrl + K / ⌘ + K で検索欄へ
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      search.focus();
    }
  });

  drawAll();

})();
</script>
</body>
</html>
